name: Build CUDA 13

on:
  push:
    branches: [ master, develop**, ci ]
    tags:
      - '*'
  pull_request:
    branches: [ master, develop** ]

env:
  CUDATOOLKIT_URL: https://developer.download.nvidia.com/compute/cuda/13.1.0/local_installers/cuda_13.1.0_windows.exe
  CUDATOOLKIT_COMPONENTS: nvcc_13.1 cudart_13.1 cuda_runtime_13.1 cublas_13.1 cublas_dev_13.1 curand_13.1 curand_dev_13.1 cusparse_13.1 cusparse_dev_13.1 thrust_13.1 visual_studio_integration_13.1

jobs:
  build_wheels_linux:
    name: Build wheel on Linux
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@master

    - name: Build wheels
      uses: pypa/cibuildwheel@v2.23
      with:
        package-dir: backend/cuda13
        config-file: backend/cuda13/cibuildwheel.toml
        output-dir: wheelhouse

    - name: Upload artifacts to github
      uses: actions/upload-artifact@v5
      with:
        name: wheels-cuda13-linux
        path: ./wheelhouse

  build_wheels_windows:
    name: Build wheel on Windows
    runs-on: windows-2022
    defaults:
      run:
        shell: cmd
    steps:
    - uses: actions/checkout@master

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2.0.0

    - name: Add Windows SDK
      run: |
        choco install windows-sdk-8.1

    - name: cache install cuda
      id: cache-install
      uses: actions/cache@v4
      with:
        path: C:\Program Files (x86)\Intel\oneAPI\
        key: install-${{ env.CUDATOOLKIT_URL }}-${{ env.CUDATOOLKIT_COMPONENTS }}

    - name: install cuda
      if: steps.cache-install.outputs.cache-hit != 'true'
      run: |
        curl.exe --output %TEMP%\cuda.exe --url %CUDATOOLKIT_URL% --retry 5 --retry-delay 5
        start /b /wait %TEMP%\cuda.exe -s %CUDATOOLKIT_COMPONENTS%
        del %TEMP%\cuda.exe

    - name: Build wheels
      uses: pypa/cibuildwheel@v2.23
      with:
        package-dir: backend/cuda13
        config-file: backend/cuda13/cibuildwheel.toml
        output-dir: wheelhouse

    - name: Upload artifacts to github
      uses: actions/upload-artifact@v5
      with:
        name: wheels-cuda13-windows
        path: ./wheelhouse

  publish_to_pypi:
    name: Publish CUDA 13 wheels to PyPI
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags')
    needs: [build_wheels_linux, build_wheels_windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-cuda13-*
          path: dist
          merge-multiple: true

      - name: Upload wheels to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.pypi_password }}
        run: |
          python -m pip install --upgrade twine
          twine upload dist/*
