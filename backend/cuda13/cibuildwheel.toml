[tool.cibuildwheel]
build = "cp3*"
# CUDA 13 requires C++17, skip Python 3.8 which uses older compilers in manylinux2014
skip = ["cp36-*", "cp37-*", "cp38-*", "*-win32", "*-manylinux_i686", "*-musllinux_*"]
build-verbosity = 1
before-build = "rm -rf {package}/osqp_sources/build"
repair-wheel-command = ""

[tool.cibuildwheel.linux]
before-all = [
  "yum-config-manager --add-repo https://developer.download.nvidia.com/compute/cuda/repos/rhel9/x86_64/cuda-rhel9.repo",
  "yum search cuda-toolkit*",
  "yum install -y cuda-toolkit-13-1"
]
environment = { CMAKE_CUDA_COMPILER = "/usr/local/cuda-13.1/bin/nvcc" }

[tool.cibuildwheel.windows]
environment = { CMAKE_CUDA_COMPILER = "C:/Program Files/NVIDIA GPU Computing Toolkit/CUDA/v13.1/bin/nvcc.exe", CUDA_TOOLKIT_ROOT_DIR = "C:/Program Files/NVIDIA GPU Computing Toolkit/CUDA/v13.1", CMAKE_GENERATOR_TOOLSET = "cuda=C:/Program Files/NVIDIA GPU Computing Toolkit/CUDA/v13.1" }
